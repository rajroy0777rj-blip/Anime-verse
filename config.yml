# IMPORTANT: replace YOUR_GITHUB_USERNAME/YOUR_REPOSITORY with your real GitHub repo.
backend:
  name: github
  repo: YOUR_GITHUB_USERNAME/YOUR_REPOSITORY
  branch: main
  # GitHub backend requires the logged-in CMS user to have write access to this repo.

publish_mode: editorial_workflow
site_url: https://YOUR-NETLIFY-SITE.netlify.app
display_url: https://YOUR-NETLIFY-SITE.netlify.app
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: posts
    label: Anime Articles
    label_singular: Anime Article
    folder: content/posts
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}} — {{category}}"
    preview_path: "news/{{slug}}/"
    fields:
      - { label: Layout, name: layout, widget: hidden, default: "article.njk" }
      - { label: Title, name: title, widget: string }
      - { label: Slug (URL), name: slug, widget: string, hint: "Example: solo-leveling-season-update" }
      - { label: Publish Date, name: date, widget: datetime }
      - { label: Category, name: category, widget: select, options: [Anime News, Seasonal Anime, Manga, Reviews, Industry, Movies, Games] }
      - { label: Tags, name: tags, widget: list, required: false }
      - { label: Short Description, name: description, widget: text }
      - { label: Featured Image, name: featured_image, widget: image }
      - { label: Author, name: author, widget: string, default: "ANIMEVERSE Editorial" }
      - { label: Read Time, name: read_time, widget: string, default: "5 min read" }
      - { label: External Link (optional), name: external_url, widget: string, required: false, hint: "Leave empty to link to the article page; use https:// for external links." }
      - { label: SEO Title, name: seo_title, widget: string, required: false }
      - { label: SEO Description, name: seo_description, widget: text, required: false }
      - { label: Social Preview Image, name: social_image, widget: image, required: false }
      - { label: Article Body, name: body, widget: markdown }

  - name: photos
    label: Photo Gallery
    label_singular: Photo
    folder: content/photos
    create: true
    delete: true
    slug: "{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Image, name: image, widget: image }
      - { label: Caption, name: caption, widget: string, required: false }
      - { label: Category, name: category, widget: string, required: false }
      - { label: Alt Text, name: alt, widget: string }
      - { label: External Link (optional), name: link, widget: string, required: false }

  - name: settings
    label: Theme Customize
    files:
      - label: Site Settings
        name: site
        file: data/site.json
        fields:
          - { label: Site Title, name: title, widget: string }
          - { label: Tagline, name: tagline, widget: string }
          - { label: Site Description, name: description, widget: text }
          - { label: Primary Accent Color, name: accent_color, widget: color, default: "#9b72ff" }
          - { label: Secondary Accent Color, name: secondary_color, widget: color, default: "#55a7ff" }
          - { label: Social Preview Image URL, name: social_image, widget: string, required: false }
          - { label: Instagram URL, name: instagram, widget: string, required: false }
          - { label: YouTube URL, name: youtube, widget: string, required: false }
          - { label: X / Twitter URL, name: twitter, widget: string, required: false }
